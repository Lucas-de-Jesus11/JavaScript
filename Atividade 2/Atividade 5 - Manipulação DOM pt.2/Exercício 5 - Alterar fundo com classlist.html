<!-- Crie um botão “Mudar fundo”.
Ao clicar:
• Use classList.toggle("fundo") para adicionar ou remover uma classe no <body>
que muda a cor de fundo. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar fundo</title>
    <style>
        body{
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fafafa;
            font-family: Arial, Helvetica, sans-serif;
            transition: background-color 0.5s ease;
        }
        .fundo{
            background-color: #87ceeb;
        }
        button{
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background-color: #0078d7;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s, transform 0.2s;
        }
        button:hover{
            background-color: #005fa3;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <button id="boatofundo">Mudar fundo</button>
    <script>
        const botao =document.getElementById("boatofundo")
        botao.addEventListener("click", () =>{
            document.body.classList.toggle("fundo")
        })
    </script>
</body>
</html>

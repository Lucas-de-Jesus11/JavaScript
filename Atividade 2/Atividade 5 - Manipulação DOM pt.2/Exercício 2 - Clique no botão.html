<!-- Crie um botão “Clique aqui”.
Cada vez que o usuário clicar:
• Mostre no console: "Clicou X vezes", onde X é o número de cliques.
• Quando chegar a 5 cliques, mostre um alert("Você clicou 5 vezes!").
• Ao atingir 10 cliques, mostre os confetes na tela. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clique no botão</title>
    <style>
        body{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f0f0f0;
        }
        button{
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }
        button:hover{
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <button>Clique Aqui</button>
    <hr>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script>
        const button = document.querySelector("button")
        button.addEventListener("click", () => {
            })

        const hyperlink = document.querySelector("button")
        let cont = 0
        hyperlink.addEventListener("click", () => {
            cont++
            console.log(`Clicou: ${cont} vezes`)
            if (cont === 5) {
                alert("Você clicou 5 vezes")
            }
            if (cont === 10) {
                confetti({
                    particleCount: 1000, // Define a quantidade de confetes
                    spread: 180, // Define o angulo
                    origin: { y: 0.6 } // Define de onde os confetes saem
                })
                alert("🎉Parabéns! você clicou 10 vezes")
            }
        })
    </script>

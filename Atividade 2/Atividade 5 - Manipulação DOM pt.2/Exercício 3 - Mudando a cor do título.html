<!-- Crie um <h1> com o texto “Minha Página” e um botão “Alterar cor”.
Quando o botão for clicado:
• Mude a cor do título para vermelho.
• Mude o tamanho da fonte para 50px. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mudando a cor do título</title>
    <style>
        body{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f5f5;
        }
        h1{
            transition: color 0.4s ease, font-size 0.4s ease ;
        }
        button{
            margin-top: 20px;
            padding: 10px 20px;
            background-color: black;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            transition:  background-color 0.3s;
        }
    </style>
</head>
<body>
    <h1 id="title">Minha Página</h1>
    <button id="button">Alterar cor do título</button>

    <script>
        const titleEl = document.querySelector("#title")
        const buttonEl = document.querySelector("#button")
        buttonEl.addEventListener("click", () => {
            titleEl.style = "color:red; font-size: 50px"
        })
    </script>
</body>
</html>

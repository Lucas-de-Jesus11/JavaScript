<!-- Crie uma página com um <h1> escrito “Carregando...”.
Use o evento DOMContentLoaded para alterar o texto do título para “Página carregada
com sucesso!” e exiba no console a mensagem "DOM carregado!".--> 
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Pronto</title>
    <style>
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
            color: #333;
            font-family: Arial, Helvetica, sans-serif;
        }
        h1{
            font-size: 2em;
            transition: color 0.5s ease;
        }
        
    </style>
</head>

<body>
    <h1 id="titulo">Carregando...</h1>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const el1 = document.getElementById("titulo")
            el1.textContent = "Página Carregada"
            console.log("DOM carregado")
        })
    </script>
</body>

</html>

<!-- Crie um campo <input type="text">.
Toda vez que o aluno digitar algo:
• Mostre no console qual tecla foi pressionada (event.key e event.keyCode).
• Quando a tecla Enter for pressionada, exiba um alert("Você pressionou
ENTER!"). -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evento de teclado</title>
    <style>
        body{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f4;
        }
        input[type="text"]{
            width: 250px;
            padding: 10px 12px;
            border: 2px solid #007bff;
            border-radius: 6px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus{
            border-color: #0056b3;
            box-shadow:  0 0 5px rgba(0, 91, 187, 0.4);
        }
        p{
            margin-top: 15px;
            color: #333;
        }
    </style>
</head>
<body>
    <input type="text" name="" id="" placeholder="Digite aqui:">
    <script>
        const inputEl = document.querySelector("input[type=text]")
        inputEl.addEventListener("keyup", (event) => {
            console.log(`Você teclou: ${event.key} - ${event.keyCode}`)
        })
        inputEl.addEventListener("keyup", (event) => {
            if (event.key === "Enter" || event.keyCode === 13) {
                alert("Você pressionou ENTER!")
            }
        })
    </script>
</body>
</html>

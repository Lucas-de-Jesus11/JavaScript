<!-- Crie um <h1> com o texto “Clique em mim”.
Quando o usuário clicar no título:
• Altere o texto para “Você clicou no título!”.
• Mude o fundo para amarelo e a cor da letra para azul. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clique no título</title>
</head>
    <style>
        body{
            background-color: #f0f0f0;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            margin-top: 100px;
            transition: background-color 0.5s;
        }
        h1{
            display: inline-block;
            padding: 20px 40px;
            border-radius: 10px;
            background-color: white;
            color: #333;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        h1:hover{
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }
        .fundo{
            background-color: yellow;
            color: blue;
        }
        </style>
<body>
    <h1 id="title">Clique em mim</h1>
    <script>
        const titleEl = document.querySelector("#title")
        const corpoEl = document.querySelector("body")
        titleEl.addEventListener("click", () => {
            titleEl.textContent = "Você clicou no título"
            titleEl.style = "color:blue"
            corpoEl.classList.toggle("fundo")
        })
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="title">Título da página</h1>
    <button id="button">Alterar cor</button>

    <script>
        const titleEl = document.querySelector("#title")
        const buttonEl = document.querySelector("#button")
        buttonEl.addEventListener("click", () => {
            titleEl.innerHTML = "Lucas"
            titleEl.style = "color:blue; font-size: 55px"
        })

        titleEl.addEventListener("click", () => {
            buttonEl.innerHTML = "Não clique"
            titleEl.style.color = "green"
            titleEl.style.background = "purple"
        })
    </script>
</body>
</html>
